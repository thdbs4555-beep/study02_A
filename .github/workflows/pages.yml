name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/todo-app-prd-2touoj
    paths:
      - index.html
      - style.css
      - app.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않게 하고, 진행 중인 배포는 끝까지 마친다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 앱 실행에 필요한 파일만 배포한다 (PRD 등 문서는 제외).
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html style.css app.js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
